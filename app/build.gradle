apply plugin: 'com.android.application'

android {
    namespace 'com.example.slideassist'
    compileSdk 35
    buildFeatures { buildConfig true }
    testBuildType 'fixtureCheck'

    defaultConfig {
        applicationId 'com.example.slideassist'
        buildConfigField 'String', 'TARGET_PACKAGE', '"com.dada.mobile.android"'
        manifestPlaceholders.targetPackage = 'com.dada.mobile.android'
        manifestPlaceholders.appLabel = '骑士滑动辅助'
        minSdk 24
        targetSdk 35
        testInstrumentationRunner 'com.example.slideassist.GestureInstrumentation'
        versionCode 2
        versionName '1.1.0'
    }
    buildTypes {
        fixtureCheck {
            initWith debug
            applicationIdSuffix '.testfixture'
            manifestPlaceholders.appLabel = '滑动辅助·测试夹具'
            matchingFallbacks = ['debug']
            buildConfigField 'String', 'TARGET_PACKAGE', '"com.example.slideassist.fixture"'
            manifestPlaceholders.targetPackage = 'com.example.slideassist.fixture'
        }
    }
}
